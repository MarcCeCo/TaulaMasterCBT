name: Sincronització Visor 3D

# Sincronització Autodesk Forma/ACC → Supabase.
#   · cron: dia 1 de cada mes a les 06:00 UTC
#   · workflow_dispatch: el dispara el botó «Executar ara» de Control d'Agents
#     (funció de Vercel api/run-sync.ts) o es pot llançar a mà des d'Actions.
#
# Secrets de GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   APS_CLIENT_ID, APS_CLIENT_SECRET,
#   APS_SSA_ID, APS_SSA_KEY_ID, APS_SSA_PRIVATE_KEY,
#   APS_HUB_ID, APS_PROJECT_ID

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sincronització ACC → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compilar l'agent
        working-directory: agents-independents/visor3d
        run: npm run build

      - name: Executar sincronització
        working-directory: agents-independents/visor3d
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          APS_SSA_ID: ${{ secrets.APS_SSA_ID }}
          APS_SSA_KEY_ID: ${{ secrets.APS_SSA_KEY_ID }}
          APS_SSA_PRIVATE_KEY: ${{ secrets.APS_SSA_PRIVATE_KEY }}
          APS_HUB_ID: ${{ secrets.APS_HUB_ID }}
          APS_PROJECT_ID: ${{ secrets.APS_PROJECT_ID }}
        run: npm run sync
