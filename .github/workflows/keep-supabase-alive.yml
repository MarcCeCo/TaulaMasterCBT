name: Keep Supabase Alive

on:
  schedule:
    # S'executa cada 3 dies a les 9:00 UTC (evita la pausa per inactivitat)
    - cron: '0 9 */3 * *'
  workflow_dispatch: # Permet executar-lo manualment

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert keep-alive record
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            --connect-timeout 10 \
            -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/keep_alive_log" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"pinged_at": "now()"}')
          echo "Resposta HTTP: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Supabase actiu - registre inserit correctament"
          else
            echo "❌ Error: codi $response"
            exit 1
          fi
