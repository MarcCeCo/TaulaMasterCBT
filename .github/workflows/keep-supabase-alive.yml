name: Keep Supabase Alive

on:
  schedule:
    # S'executa cada 3 dies a les 9:00 UTC (evita la pausa per inactivitat)
    - cron: '0 9 */3 * *'
  workflow_dispatch: # Permet executar-lo manualment

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            --connect-timeout 10 \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/user_profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Resposta HTTP: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "✅ Supabase actiu"
          else
            echo "❌ Error: codi $response"
            exit 1
          fi
