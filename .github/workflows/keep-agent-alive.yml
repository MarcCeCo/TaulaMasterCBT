name: Keep Agent Alive

# Fa ping al servei cada 14 minuts per evitar que Render (free tier) adormi
# el procés. L'endpoint /health és de només lectura i no dispara cap execució.

on:
  schedule:
    - cron: '*/14 * * * *'  # Cada 14 minuts (Render dorm després de 15 min d'inactivitat)
  workflow_dispatch:

jobs:
  ping:
    name: Ping keep-alive
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping /health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 --connect-timeout 10 \
            "${{ secrets.AGENT_URL }}/health")

          echo "Resposta HTTP: $response"

          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "✅ Agent actiu"
          else
            echo "❌ Error: codi $response"
            exit 1
          fi
