name: Keep Agent Alive

on:
  schedule:
    # Ping cada 10 minuts per evitar que Render adormi el servei
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permet executar-lo manualment si cal

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Agent
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            --connect-timeout 10 \
            "${{ secrets.AGENT_URL }}/health")

          echo "Resposta HTTP: $response"

          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "✅ Agent actiu"
          else
            echo "❌ Error: codi $response"
            exit 1
          fi
