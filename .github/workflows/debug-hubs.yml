name: Debug - Llista Hubs APS (executar 1 cop)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Llista hubs accessibles
        run: |
          RESPONSE=$(curl -s \
            "https://visor3d-agent.onrender.com/debug/hubs" \
            -H "Authorization: Bearer ${{ secrets.AGENT_SECRET }}")
          echo "RESPOSTA COMPLETA:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"
