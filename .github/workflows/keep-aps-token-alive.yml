name: Keep APS Token Alive

on:
  schedule:
    # TEMPORAL: cada 2 minuts per activar el primer Scheduled - tornar a 0 3 */10 * * un cop funcioni
    - cron: '*/2 * * * *'
  workflow_dispatch: # Permet executar-lo manualment si cal

jobs:
  sync-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Executar agent APS per renovar el refresh token
        run: |
          echo "🔄 Llançant l'agent APS per renovar el token..."

          response=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.AGENT_URL }}/sync" \
            -H "Authorization: Bearer ${{ secrets.AGENT_SECRET }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "Resposta HTTP: $http_code"
          echo "Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Agent llançat correctament — el refresh token s'ha renovat"
          else
            echo "❌ Error llançant l'agent: codi $http_code"
            exit 1
          fi
