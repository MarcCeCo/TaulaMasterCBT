name: Add Service Account (executar 1 cop)

on:
  workflow_dispatch:

jobs:
  add-sa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instal·la dependències
        run: cd agent && bun install
      - name: Executa add-service-account
        run: cd agent && bun run src/add-service-account.ts
        env:
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          APS_HUB_ID: ${{ secrets.APS_HUB_ID }}
          APS_PROJECT_ID: ${{ secrets.APS_PROJECT_ID }}
