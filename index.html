<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CBT TaulaMaster — Gestió d'actius i paràmetres tècnics BIM" />
    <meta name="theme-color" content="#003D44" />

    <!--
      PERF: preconnect + dns-prefetch per Supabase → TCP/TLS resolt MENTRE
      el navegador analitza el HTML, ~200ms menys a la primera petició de dades.
    -->
    <link rel="preconnect" href="https://supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://supabase.co" />

    <!--
      PERF: fonts amb display=swap → text visible immediatament amb font del sistema,
      substituïda per Plus Jakarta Sans quan carrega. preconnect obert primer.
      Movem el <link> de fonts AQUÍ (abans del CSS crític) però amb display=swap
      perquè no bloquegi el First Contentful Paint.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!--
      Fallback per navegadors sense JS: carrega les fonts normalment.
      S'elimina automàticament un cop el onload s'executa.
    -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- OG tags -->
    <meta property="og:title" content="CBT · TaulaMaster" />
    <meta property="og:description" content="Gestió d'actius BIM i paràmetres tècnics segons GuBIMClass" />
    <meta property="og:type" content="website" />

    <title>CBT · TaulaMaster</title>

    <!--
      NOTA: el favicon apunta a /favicon.png (a public/) perquè en build de producció
      Vite no processa els assets de /src/ referenciats des de l'HTML directament.
      Copia public/favicon.png o canvia la ruta a /favicon.ico si en tens un.
      Per ara, apuntem al path públic correcte:
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
