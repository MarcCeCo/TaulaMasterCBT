<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CBT TaulaMaster — Gestió d'actius i paràmetres tècnics BIM" />
    <meta name="theme-color" content="#003D44" />
    <!-- Tipografia CBT: DM Sans (body) + DM Mono (codis) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta property="og:title" content="CBT · TaulaMaster" />
    <meta property="og:description" content="Gestió d'actius BIM i paràmetres tècnics segons GuBIMClass" />
    <meta property="og:type" content="website" />
    <title>CBT · TaulaMaster</title>
    <link rel="icon" type="image/png" href="/src/assets/Simbol_Web2.png" />
    <!--
      PERF: preconnect obre TCP+TLS a Supabase MENTRE el navegador
      carrega el JS → la primera petició de dades arriba ~200ms abans.
    -->
    <link rel="preconnect" href="https://supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <!--
      PERF: modulepreload del chunk principal accelera el TTI
      (Vite afegirà automàticament els modulepreload del build,
       però el main chunk es pot preindicar manualment)
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
